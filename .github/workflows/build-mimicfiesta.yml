name: Build MimicFiesta APK

on:
  push:
    branches: [ mimicfiesta-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore project
        run: |
          rm -rf /tmp/MimicFiesta
          mkdir -p /tmp/MimicFiesta
          base64 -d MimicFiesta/project.b64 > /tmp/mimicfiesta-src.tar.gz
          tar -xzf /tmp/mimicfiesta-src.tar.gz -C /tmp/MimicFiesta
          cd /tmp/MimicFiesta
          python3 tools/generate_sounds.py
          cat >> app/build.gradle <<'EOF'

          configurations.configureEach {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
      - name: Build APK
        working-directory: /tmp/MimicFiesta
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -f /tmp/MimicFiesta/app/build/outputs/apk/debug/app-debug.apk
          ls -lh /tmp/MimicFiesta/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MimicFiesta-debug-apk
          path: /tmp/MimicFiesta/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
